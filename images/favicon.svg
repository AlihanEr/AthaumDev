<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13131a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="d-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b47eff;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="128" height="128" rx="20" fill="url(#bg-gradient)"/>

  <!-- Letter A (white) - centered with text-anchor -->
  <text x="42" y="88" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">A</text>

  <!-- Letter D (gradient) - centered with text-anchor -->
  <text x="86" y="88" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="url(#d-gradient)" text-anchor="middle" filter="url(#glow)">D</text>
</svg>
